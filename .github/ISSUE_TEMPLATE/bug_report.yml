name: Bug Report
description: 报告工具错误、回归问题、兼容性问题或文档与行为不一致的问题
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        提交前请尽量先确认：
        - 已阅读 README 和相关 docs
        - 问题可稳定复现
        - 如果是安全问题，请不要在公开 issue 中直接贴出敏感利用细节

  - type: textarea
    id: summary
    attributes:
      label: 问题概述
      description: 简洁说明是什么问题
      placeholder: 例如：`crawl_webpages` 在某类目录页上会提前停止，未继续进入正文页
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 按顺序描述如何复现
      placeholder: |
        1. 在 Windows 11 / Python 3.12 环境启动客户端
        2. 调用某个工具
        3. 传入哪些参数
        4. 看到什么结果
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望结果
      placeholder: 应该发生什么
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      placeholder: 实际发生了什么，最好附返回结果或报错
    validations:
      required: true

  - type: input
    id: tool_name
    attributes:
      label: 涉及的工具
      description: 如果知道，请写工具名
      placeholder: 例如：fetch_webpage_text / create_background_task / run_shell

  - type: textarea
    id: environment
    attributes:
      label: 环境信息
      description: 尽量写清运行环境
      placeholder: |
        - OS:
        - Python:
        - Client:
        - Project commit:
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: 补充信息
      description: 其他上下文、截图、日志、相关链接等

