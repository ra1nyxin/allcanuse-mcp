[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "allcanuse-mcp"
version = "0.1.0"
description = "A Windows/Linux MCP server that exposes practical workstation tools for local agents."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "allcanuse-mcp contributors" },
]
keywords = ["mcp", "agent", "tools", "windows", "linux", "automation"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
]
dependencies = [
  "mcp>=1.27.0",
  "psutil>=5.9.0",
  "pywin32>=306; platform_system == 'Windows'",
  "Pillow>=10.0.0",
]

[project.scripts]
allcanuse-mcp = "allcanuse_mcp.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
